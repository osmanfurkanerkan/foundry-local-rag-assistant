<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local RAG Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #e1e1e6;
    --accent: #2563eb;
    --user-bubble: #2563eb;
    --user-bubble-text: #ffffff;
    --assistant-bubble: #eef0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --panel: #1c1c1f;
      --text: #f2f2f4;
      --muted: #9a9aa2;
      --border: #2c2c31;
      --assistant-bubble: #2a2a30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  header p { margin: 0.15rem 0 0; font-size: 0.85rem; color: var(--muted); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .msg { display: flex; flex-direction: column; max-width: 82%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 0.65rem 0.9rem;
    border-radius: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    font-size: 0.95rem;
  }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-bubble-text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .sources { margin-top: 0.3rem; font-size: 0.75rem; color: var(--muted); }
  .error .bubble { background: #fde2e1; color: #7a1f1a; }
  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  input {
    flex: 1;
    padding: 0.7rem 0.9rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 0.7rem 1.1rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { color: var(--muted); font-size: 0.85rem; padding: 0 1.25rem 0.5rem; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Local RAG Assistant</h1>
      <p>Foundry Local dokumanlari uzerinde calisan yerel RAG asistani</p>
    </header>
    <div id="chat"></div>
    <div class="typing" id="typing"></div>
    <form id="form">
      <input id="question" type="text" placeholder="Bir soru yaz..." autocomplete="off" />
      <button id="send" type="submit">Gonder</button>
    </form>
  </div>

<script>
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("question");
  const sendBtn = document.getElementById("send");
  const typingEl = document.getElementById("typing");

  // Faz 3.1'in coklu-tur mantigi: HTTP durumsuz oldugu icin gecmisi
  // istemci tarafinda tutup her istekte API'ye geri gonderiyoruz.
  const history = [];

  function addMessage(role, text, sources) {
    const wrapper = document.createElement("div");
    wrapper.className = `msg ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrapper.appendChild(bubble);
    if (sources && sources.length) {
      const src = document.createElement("div");
      src.className = "sources";
      src.textContent = `Kaynak: ${sources.join(", ")}`;
      wrapper.appendChild(src);
    }
    chatEl.appendChild(wrapper);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrapper;
  }

  formEl.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = inputEl.value.trim();
    if (!question) return;

    addMessage("user", question);
    inputEl.value = "";
    inputEl.disabled = true;
    sendBtn.disabled = true;
    typingEl.textContent = "Yaziyor...";

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${response.status}`);
      }

      const data = await response.json();
      addMessage("assistant", data.answer, data.sources);
      history.push({ question, answer: data.answer });
    } catch (err) {
      const wrapper = addMessage("assistant", `Hata: ${err.message}`);
      wrapper.classList.add("error");
    } finally {
      typingEl.textContent = "";
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  });
</script>
</body>
</html>
